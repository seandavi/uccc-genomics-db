[project]
name = "uccc-genomics-mcp"
version = "0.1.0"
description = "MCP (v2) server for UCCC de-identified genomics DuckDB"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.1.0",
    "duckdb>=1.5.5",
    "uccc-genomics-db",
]

[project.scripts]
genomics-mcp = "uccc_genomics_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uccc_genomics_mcp"]

[tool.uv.sources]
uccc-genomics-db = { workspace = true }
