[project]
name = "uccc-genomics-db"
version = "0.1.0"
description = "Caris + Foundation Medicine NGS reports as one de-identified DuckDB, with a dashboard and MCP server"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
]

[project.scripts]
genomics = "uccc_genomics.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uccc_genomics"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.workspace]
members = ["mcp"]

