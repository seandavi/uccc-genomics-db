# Static-assets Worker for the genomics dashboard. No worker code: Cloudflare serves
# dist/ directly. Deployed daily by systemd/genomics.service after the build.
#
# Access control is Cloudflare Access on the custom domain (one-time PIN to
# institutional email). That only protects the custom domain, so the
# *.workers.dev route and preview URLs must stay off.
name = "uccc-genomics-dashboard"
compatibility_date = "2026-09-01"
workers_dev = false
preview_urls = false

routes = [{ pattern = "uccc-genomics.cancerdatasci.org", custom_domain = true }]

[assets]
directory = "./dist"
not_found_handling = "404-page"

[observability]
enabled = true
