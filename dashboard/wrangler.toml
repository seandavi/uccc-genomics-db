# Static-assets Worker for the genomics dashboard: Cloudflare serves dist/ directly, and
# worker.js passes /api/* through to the cohort API on the campus host (COHORT_TOOL.md).
# Deployed daily by systemd/genomics.service after the build.
#
# Access control is Cloudflare Access on the custom domain (one-time PIN to
# institutional email). That only protects the custom domain, so the
# *.workers.dev route and preview URLs must stay off.
name = "uccc-genomics-dashboard"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = false
preview_urls = false

# A zone route, not a custom domain, so fetch() in worker.js reaches the origin. Needs the
# hostname as a proxied (orange-cloud) A record to the campus IP.
routes = [{ pattern = "uccc-genomics.cancerdatasci.org/*", zone_name = "cancerdatasci.org" }]

[assets]
directory = "./dist"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

[observability]
enabled = true
